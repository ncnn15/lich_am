<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch Vạn Niên</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --text:#26231f; --muted:#8a8378; --line:#e7e1d7;
  --accent:#b3261e; --accent-soft:#fbe9e7; --today:#1f6feb; --sun:#c62828; --sat:#1565c0;
  --gold:#a8741a; --shadow:0 2px 12px rgba(60,40,20,.08);
}
:root[data-theme="dark"]{
  --bg:#17161a; --card:#212026; --text:#ece8e1; --muted:#9b958a; --line:#34323a;
  --accent:#ef5350; --accent-soft:#3a2323; --today:#58a6ff; --sun:#ff6b63; --sat:#64b5f6;
  --gold:#e0b45a; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toolbar .spacer{flex:1}
button,select,input[type=number],input[type=date]{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=number]{width:84px}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;user-select:none}
.main{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.title{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 10px}
.title b{font-size:22px}
.title span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-weight:600;font-size:13px;color:var(--muted);padding:6px 0}
.dow.sun,.cell.sun .s{color:var(--sun)}
.dow.sat,.cell.sat .s{color:var(--sat)}
.cell{position:relative;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);text-align:left}
.cell:hover{border-color:var(--accent)}
.cell .s{font-size:20px;font-weight:600}
.cell .l{font-size:12px;color:var(--muted)}
.cell.out{opacity:.38}
.cell.mark .l{color:var(--accent);font-weight:600}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cell.sel{background:var(--accent-soft);border-color:var(--accent)}
.cell .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cell .hol{font-size:10px;color:var(--gold);line-height:1.1;overflow:hidden;max-height:22px}
.nolunar .cell{min-height:56px}
.nolunar .cell .l,.nolunar .cell .hol{display:none}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini h4{margin:0 0 4px;font-size:14px}
.mini .grid{gap:1px}
.mini .d{font-size:11px;text-align:center;padding:2px 0;border-radius:4px}
.mini .d.h{color:var(--muted)}
.mini .d.today{background:var(--today);color:#fff}
.mini .d.sun{color:var(--sun)}
.detail .big{font-size:72px;font-weight:700;line-height:1;color:var(--accent)}
.detail .wd{font-size:18px;font-weight:600}
.detail .ml{color:var(--muted)}
.detail hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.hours{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hours span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);margin:2px 4px 2px 0}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 Lịch Vạn Niên</h1>

  <div class="toolbar">
    <div class="grp">
      <button id="prev" title="Tháng trước (←)">‹</button>
      <select id="selMonth"></select>
      <input type="number" id="inYear" min="1900" max="2200" title="Năm">
      <button id="next" title="Tháng sau (→)">›</button>
      <button id="today" class="primary">Hôm nay</button>
    </div>
    <div class="grp">
      <input type="date" id="jump" title="Nhảy tới ngày">
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button id="vMonth" class="on">Tháng</button>
      <button id="vYear">Năm</button>
    </div>
    <div class="grp">
      <label class="chk"><input type="checkbox" id="chkLunar" checked> Âm lịch</label>
      <select id="selWeek" title="Ngày đầu tuần">
        <option value="1">Bắt đầu T2</option>
        <option value="0">Bắt đầu CN</option>
      </select>
      <button id="theme" title="Đổi giao diện">🌓</button>
    </div>
  </div>

  <div class="main">
    <div class="panel" id="view"></div>
    <div class="panel detail" id="detail"></div>
  </div>
</div>

<script>
/* ============ 1. THUẬT TOÁN ÂM LỊCH (Hồ Ngọc Đức, múi giờ +7) ============ */
const TZ = 7, PI = Math.PI, DR = PI / 180;
const fl = Math.floor;

function jdFromDate(dd, mm, yy) {
  const a = fl((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  let jd = dd + fl((153 * m + 2) / 5) + 365 * y + fl(y / 4) - fl(y / 100) + fl(y / 400) - 32045;
  if (jd < 2299161) jd = dd + fl((153 * m + 2) / 5) + 365 * y + fl(y / 4) - 32083;
  return jd;
}
function newMoonDay(k) {
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T;
  let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
  Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * DR);
  const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * DR) + 0.0021 * Math.sin(2 * DR * M)
    - 0.4068 * Math.sin(Mpr * DR) + 0.0161 * Math.sin(DR * 2 * Mpr) - 0.0004 * Math.sin(DR * 3 * Mpr)
    + 0.0104 * Math.sin(DR * 2 * F) - 0.0051 * Math.sin(DR * (M + Mpr)) - 0.0074 * Math.sin(DR * (M - Mpr))
    + 0.0004 * Math.sin(DR * (2 * F + M)) - 0.0004 * Math.sin(DR * (2 * F - M))
    - 0.0006 * Math.sin(DR * (2 * F + Mpr)) + 0.0010 * Math.sin(DR * (2 * F - Mpr))
    + 0.0005 * Math.sin(DR * (2 * Mpr + M));
  const dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
                     : -0.000278 + 0.000265 * T + 0.000262 * T2;
  return fl(Jd1 + C1 - dt + 0.5 + TZ / 24);
}
function sunLongitude(jdn) { // radian 0..2π
  const T = (jdn - 2451545.5 - TZ / 24) / 36525, T2 = T * T;
  const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  const DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(DR * M)
    + (0.019993 - 0.000101 * T) * Math.sin(DR * 2 * M) + 0.000290 * Math.sin(DR * 3 * M);
  let L = (L0 + DL) * DR;
  return L - PI * 2 * fl(L / (PI * 2));
}
const sunMajor = jd => fl(sunLongitude(jd) / PI * 6);
function lunarMonth11(yy) {
  const off = jdFromDate(31, 12, yy) - 2415021;
  const k = fl(off / 29.530588853);
  let nm = newMoonDay(k);
  if (sunMajor(nm) >= 9) nm = newMoonDay(k - 1);
  return nm;
}
function leapOffset(a11) {
  const k = fl((a11 - 2415021.076998695) / 29.530588853 + 0.5);
  let last = 0, i = 1, arc = sunMajor(newMoonDay(k + i));
  do { last = arc; i++; arc = sunMajor(newMoonDay(k + i)); } while (arc !== last && i < 14);
  return i - 1;
}
const lunarCache = new Map();
function solar2lunar(dd, mm, yy) {
  const jd = jdFromDate(dd, mm, yy);
  if (lunarCache.has(jd)) return lunarCache.get(jd);
  const k = fl((jd - 2415021.076998695) / 29.530588853);
  let monthStart = newMoonDay(k + 1);
  if (monthStart > jd) monthStart = newMoonDay(k);
  let a11 = lunarMonth11(yy), b11 = a11, ly;
  if (a11 >= monthStart) { ly = yy; a11 = lunarMonth11(yy - 1); }
  else { ly = yy + 1; b11 = lunarMonth11(yy + 1); }
  const ld = jd - monthStart + 1;
  const diff = fl((monthStart - a11) / 29);
  let leap = 0, lm = diff + 11;
  if (b11 - a11 > 365) {
    const lo = leapOffset(a11);
    if (diff >= lo) { lm = diff + 10; if (diff === lo) leap = 1; }
  }
  if (lm > 12) lm -= 12;
  if (lm >= 11 && diff < 4) ly -= 1;
  const r = { d: ld, m: lm, y: ly, leap, jd };
  lunarCache.set(jd, r);
  return r;
}

/* ============ 2. CAN CHI, TIẾT KHÍ, GIỜ HOÀNG ĐẠO, NGÀY LỄ ============ */
const CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
const HOURS = ["23–1","1–3","3–5","5–7","7–9","9–11","11–13","13–15","15–17","17–19","19–21","21–23"];
const HD = ["110100101100","001101001011","110011010010","101100110100","001011001101","010010110011"];
const TERMS = ["Xuân phân","Thanh minh","Cốc vũ","Lập hạ","Tiểu mãn","Mang chủng","Hạ chí","Tiểu thử","Đại thử","Lập thu","Xử thử","Bạch lộ","Thu phân","Hàn lộ","Sương giáng","Lập đông","Tiểu tuyết","Đại tuyết","Đông chí","Tiểu hàn","Đại hàn","Lập xuân","Vũ thủy","Kinh trập"];
const WD = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
const WD_S = ["CN","T2","T3","T4","T5","T6","T7"];

const canChiDay = jd => CAN[(jd + 9) % 10] + " " + CHI[(jd + 1) % 12];
const canChiYear = y => CAN[(y + 6) % 10] + " " + CHI[(y + 8) % 12];
const canChiMonth = (y, m) => CAN[(y * 12 + m + 3) % 10] + " " + CHI[(m + 1) % 12];
function solarTerm(jd) {
  const t = jd2 => fl(sunLongitude(jd2) / PI * 12);
  return t(jd) !== t(jd - 1) ? TERMS[t(jd)] : null;
}
function goodHours(jd) {
  const pat = HD[((jd + 1) % 12) % 6];
  return HOURS.map((h, i) => pat[i] === "1" ? CHI[i] + " (" + h + ")" : null).filter(Boolean);
}
const SOLAR_HOL = {"1/1":"Tết Dương lịch","14/2":"Valentine","8/3":"Quốc tế Phụ nữ","30/4":"Giải phóng miền Nam","1/5":"Quốc tế Lao động","1/6":"Quốc tế Thiếu nhi","2/9":"Quốc khánh","20/10":"Phụ nữ Việt Nam","20/11":"Nhà giáo Việt Nam","22/12":"Quân đội nhân dân VN","24/12":"Giáng sinh"};
const LUNAR_HOL = {"1/1":"Tết Nguyên Đán","15/1":"Rằm tháng Giêng","10/3":"Giỗ Tổ Hùng Vương","15/4":"Phật Đản","5/5":"Tết Đoan Ngọ","15/7":"Vu Lan","15/8":"Tết Trung Thu","23/12":"Ông Táo chầu trời"};

function info(date) {
  const d = date.getDate(), m = date.getMonth() + 1, y = date.getFullYear();
  const l = solar2lunar(d, m, y);
  const hol = [];
  if (SOLAR_HOL[d + "/" + m]) hol.push(SOLAR_HOL[d + "/" + m]);
  if (!l.leap && LUNAR_HOL[l.d + "/" + l.m]) hol.push(LUNAR_HOL[l.d + "/" + l.m]);
  return { d, m, y, l, hol, term: solarTerm(l.jd), wd: date.getDay() };
}

/* ============ 3. TRẠNG THÁI + LƯU CÀI ĐẶT ============ */
const $ = id => document.getElementById(id);
const store = {
  get(k, def) { try { const v = localStorage.getItem("lvn_" + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("lvn_" + k, JSON.stringify(v)); } catch (e) {} }
};
const now = new Date();
const state = {
  y: now.getFullYear(), m: now.getMonth(),
  sel: new Date(now.getFullYear(), now.getMonth(), now.getDate()),
  view: store.get("view", "month"),
  lunar: store.get("lunar", true),
  weekStart: store.get("weekStart", 1),
  theme: store.get("theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
};
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const mkDate = (y, m, d) => { const x = new Date(2000, 0, 1); x.setFullYear(y, m, d); return x; };

/* ============ 4. RENDER ============ */
function dowHeader() {
  let h = "";
  for (let i = 0; i < 7; i++) {
    const w = (state.weekStart + i) % 7;
    h += `<div class="dow ${w === 0 ? "sun" : w === 6 ? "sat" : ""}">${WD_S[w]}</div>`;
  }
  return h;
}
function renderMonth() {
  const { y, m } = state;
  const first = mkDate(y, m, 1);
  const offset = (first.getDay() - state.weekStart + 7) % 7;
  const start = mkDate(y, m, 1 - offset);
  const lm = info(first).l;
  let html = `<div class="title"><b>Tháng ${m + 1} / ${y}</b><span>${canChiMonth(lm.y, lm.m)} · năm ${canChiYear(lm.y)}</span></div>`;
  html += `<div class="grid">${dowHeader()}`;
  for (let i = 0; i < 42; i++) {
    const dt = mkDate(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && dt.getMonth() !== m) break;
    const f = info(dt);
    const cls = ["cell", f.wd === 0 ? "sun" : f.wd === 6 ? "sat" : "",
      dt.getMonth() !== m ? "out" : "", sameDay(dt, now) ? "today" : "",
      sameDay(dt, state.sel) ? "sel" : "", (f.l.d === 1 || f.l.d === 15) ? "mark" : ""].join(" ");
    const lt = f.l.d === 1 ? `${f.l.d}/${f.l.m}${f.l.leap ? "N" : ""}` : f.l.d;
    html += `<button class="${cls}" data-t="${dt.getTime()}">
      <span class="s">${f.d}</span>
      <span class="l">${lt}</span>
      ${f.hol.length ? `<span class="hol">${f.hol[0]}</span>` : ""}
      ${f.term ? `<span class="dot" title="${f.term}"></span>` : ""}
    </button>`;
  }
  html += `</div>`;
  $("view").className = "panel" + (state.lunar ? "" : " nolunar");
  $("view").innerHTML = html;
}
function renderYear() {
  let html = `<div class="title"><b>Năm ${state.y}</b><span>${canChiYear(solar2lunar(1, 6, state.y).y)}</span></div><div class="year">`;
  for (let m = 0; m < 12; m++) {
    const first = mkDate(state.y, m, 1);
    const offset = (first.getDay() - state.weekStart + 7) % 7;
    const days = new Date(state.y, m + 1, 0).getDate();
    html += `<div class="mini" data-m="${m}"><h4>Tháng ${m + 1}</h4><div class="grid">`;
    for (let i = 0; i < 7; i++) html += `<div class="d h">${WD_S[(state.weekStart + i) % 7]}</div>`;
    for (let i = 0; i < offset; i++) html += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const dt = mkDate(state.y, m, d);
      html += `<div class="d ${dt.getDay() === 0 ? "sun" : ""} ${sameDay(dt, now) ? "today" : ""}">${d}</div>`;
    }
    html += `</div></div>`;
  }
  $("view").className = "panel";
  $("view").innerHTML = html + `</div>`;
}
function renderDetail() {
  const f = info(state.sel), l = f.l;
  $("detail").innerHTML = `
    <div class="wd">${WD[f.wd]}</div>
    <div class="big">${f.d}</div>
    <div class="ml">Tháng ${f.m} năm ${f.y}</div>
    <hr>
    <dl class="kv">
      <dt>Âm lịch</dt><dd>${l.d}/${l.m}${l.leap ? " (nhuận)" : ""}/${l.y}</dd>
      <dt>Ngày</dt><dd>${canChiDay(l.jd)}</dd>
      <dt>Tháng</dt><dd>${canChiMonth(l.y, l.m)}${l.leap ? " (nhuận)" : ""}</dd>
      <dt>Năm</dt><dd>${canChiYear(l.y)}</dd>
      ${f.term ? `<dt>Tiết khí</dt><dd>${f.term}</dd>` : ""}
    </dl>
    ${f.hol.length ? `<div style="margin-top:10px">${f.hol.map(h => `<span class="tag">${h}</span>`).join("")}</div>` : ""}
    <hr>
    <div class="ml">Giờ hoàng đạo</div>
    <div class="hours">${goodHours(l.jd).map(h => `<span>${h}</span>`).join("")}</div>
    <div class="hint">Phím tắt: ← → đổi tháng, ↑ ↓ đổi năm, T = hôm nay.</div>`;
}
function syncControls() {
  $("selMonth").value = state.m;
  $("inYear").value = state.y;
  $("jump").value = `${String(state.sel.getFullYear()).padStart(4, "0")}-${String(state.sel.getMonth() + 1).padStart(2, "0")}-${String(state.sel.getDate()).padStart(2, "0")}`;
  $("chkLunar").checked = state.lunar;
  $("selWeek").value = state.weekStart;
  $("vMonth").classList.toggle("on", state.view === "month");
  $("vYear").classList.toggle("on", state.view === "year");
  document.documentElement.dataset.theme = state.theme;
}
function render() {
  syncControls();
  state.view === "month" ? renderMonth() : renderYear();
  renderDetail();
}

/* ============ 5. ĐIỀU KHIỂN ============ */
function shift(dm) {
  if (state.view === "year") { state.y = Math.min(2200, Math.max(1900, state.y + dm / 12 * 1)); }
  else {
    let m = state.m + dm, y = state.y;
    while (m < 0) { m += 12; y--; }
    while (m > 11) { m -= 12; y++; }
    state.m = m; state.y = Math.min(2200, Math.max(1900, y));
  }
  render();
}
function goto(date) {
  state.sel = date; state.y = date.getFullYear(); state.m = date.getMonth(); render();
}
for (let i = 0; i < 12; i++) $("selMonth").add(new Option("Tháng " + (i + 1), i));

$("prev").onclick = () => shift(state.view === "year" ? -12 : -1);
$("next").onclick = () => shift(state.view === "year" ? 12 : 1);
$("today").onclick = () => goto(new Date());
$("selMonth").onchange = e => { state.m = +e.target.value; state.view = "month"; store.set("view", "month"); render(); };
$("inYear").onchange = e => { const v = +e.target.value; if (v >= 1900 && v <= 2200) { state.y = v; render(); } else syncControls(); };
$("jump").onchange = e => { const [y, m, d] = e.target.value.split("-").map(Number); if (y) goto(mkDate(y, m - 1, d)); };
$("vMonth").onclick = () => { state.view = "month"; store.set("view", "month"); render(); };
$("vYear").onclick = () => { state.view = "year"; store.set("view", "year"); render(); };
$("chkLunar").onchange = e => { state.lunar = e.target.checked; store.set("lunar", state.lunar); render(); };
$("selWeek").onchange = e => { state.weekStart = +e.target.value; store.set("weekStart", state.weekStart); render(); };
$("theme").onclick = () => { state.theme = state.theme === "dark" ? "light" : "dark"; store.set("theme", state.theme); render(); };

$("view").addEventListener("click", e => {
  const c = e.target.closest(".cell");
  if (c) {
    const dt = new Date(+c.dataset.t);
    state.sel = dt;
    if (dt.getMonth() !== state.m) { state.m = dt.getMonth(); state.y = dt.getFullYear(); }
    return render();
  }
  const mini = e.target.closest(".mini");
  if (mini) { state.m = +mini.dataset.m; state.view = "month"; store.set("view", "month"); render(); }
});
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") shift(-1);
  else if (e.key === "ArrowRight") shift(1);
  else if (e.key === "ArrowUp") { state.y = Math.min(2200, state.y + 1); render(); }
  else if (e.key === "ArrowDown") { state.y = Math.max(1900, state.y - 1); render(); }
  else if (e.key.toLowerCase() === "t") goto(new Date());
});

render();
</script>
</body>
</html>
